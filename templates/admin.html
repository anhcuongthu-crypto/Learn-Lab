{% extends "base.html" %}{% block title %}Quản trị — LearnLab{% endblock %}{% block content %}<h1>⚙️ Quản trị nội dung</h1><div class="grid"><form method="post" class="card"><h2>Thêm khóa học</h2><input type="hidden" name="kind" value="course"><label>Tên khóa học</label><input name="title" required><label>Mô tả</label><input name="description"><label>Emoji</label><input name="emoji" value="📘"><button>Lưu khóa học</button></form><form method="post" class="card"><h2>Thêm bài học</h2><input type="hidden" name="kind" value="lesson"><label>Khóa học</label><select name="course_id" required>{% for c in courses %}<option value="{{c.id}}">{{c.title}}</option>{% endfor %}</select><label>Tên bài học</label><input name="title" required><label>Mô tả</label><input name="description"><button>Lưu bài học</button></form><form method="post" class="card"><h2>Thêm câu hỏi</h2><input type="hidden" name="kind" value="question"><label>Bài học</label><select name="lesson_id" required>{% for c in courses %}{% for l in c.lessons %}<option value="{{l.id}}">{{c.title}} — {{l.title}}</option>{% endfor %}{% endfor %}</select><label>Nội dung câu hỏi</label><textarea name="prompt" required></textarea><label>Đáp án chính xác</label><input name="answer" required><label>Các lựa chọn (ngăn cách bằng |)</label><input name="choices" placeholder="A|B|C|D"><label>Gợi ý</label><input name="hint"><button>Lưu câu hỏi</button></form></div>{% endblock %}
