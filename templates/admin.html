{% extends "base.html" %}{% block title %}Quản trị — LearnLab{% endblock %}{% block content %}<section class="hero" style="grid-template-columns:1fr;min-height:170px;padding:27px 34px"><span class="eyebrow">ADMIN CONTROL CENTER</span><h1>⚙️ Quản trị LearnLab</h1><p>Quản lý khóa học, bài học và ngân hàng câu hỏi.</p></section><section class="section-block"><div class="section-heading"><div><span class="eyebrow">CONTENT MANAGEMENT</span><h2>Thêm nội dung</h2></div></div><div class="grid"><form method="post" class="card"><div class="card-icon">📚</div><h3>Thêm khóa học</h3><input type="hidden" name="kind" value="course"><label>Tên khóa học</label><input name="title" required><label>Mô tả</label><input name="description"><label>Emoji</label><input name="emoji" value="📘"><button>Lưu khóa học →</button></form><form method="post" class="card"><div class="card-icon">🗂️</div><h3>Thêm bài học</h3><input type="hidden" name="kind" value="lesson"><label>Khóa học</label><select name="course_id" required>{% for c in courses %}<option value="{{c.id}}">{{c.title}}</option>{% endfor %}</select><label>Tên bài học</label><input name="title" required><label>Mô tả</label><input name="description"><button>Lưu bài học →</button></form><form method="post" class="card"><div class="card-icon">✍️</div><h3>Thêm câu hỏi</h3><input type="hidden" name="kind" value="question"><label>Bài học</label><select name="lesson_id" required>{% for c in courses %}{% for l in c.lessons %}<option value="{{l.id}}">{{c.title}} — {{l.title}}</option>{% endfor %}{% endfor %}</select><label>Nội dung câu hỏi</label><textarea name="prompt" required></textarea><label>Đáp án chính xác</label><input name="answer" required><label>Các lựa chọn (ngăn cách bằng |)</label><input name="choices" placeholder="A|B|C|D"><label>Gợi ý</label><input name="hint"><button>Lưu câu hỏi →</button></form></div></section>{% endblock %}
